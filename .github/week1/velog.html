<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>velog</title>
    <script src="https://kit.fontawesome.com/1a262862d7.js" crossorigin="anonymous"></script>
    <link rel="reset" href="reset.css">
    <link rel="style" href="style.css">
</head>
<body>
    <header>
        <div>
            <img src="./image/velog_logo.svg">
        </div>

        <div>
            <i class="fa-regular fa-bell"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <button type="button">로그인</button>
        </div>
    </header>

    <nav>
        <div>
            <div>
                <i class="fa-solid fa-arrow-trend-up"></i>
                트렌딩
            </div>

            <div>
                <i class="fa-regular fa-clock"></i>
                최신
            </div>

            <div>
                <i class="fa-solid fa-rss"></i>
                피드
            </div>
        </div>

        <div>
            <select id="period">
                <option value="today">오늘</option>
                <option value="week" selected>이번 주</option>
                <option value="month">이번 달</option>
                <option value="year">올해</option>
            </select>

            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </nav>

    <main>
        <ul>
            <li>
                <img src="./image/nampodong.png">

                <div>
                    <img src="./image/profile.PNG">
                    <span>by</span>
                    <span>가나디</span>
                </div>

                <div>
                    <div>
                        <div>
                            <h3>제목</h3>
                            <span>이렇게 하는 게 맞는 건지 모르겠어요... 그냥 하고 있긴 한데......</span>
                        </div>
                        
                        <div>
                            <span>2024년 10월 31일</span>
                            <span>3개의 댓글</span>                            
                        </div>
                    </div>

                    <div>
                        <i class="fa-solid fa-heart"></i>
                        37
                    </div>
                </div>
            </li>
            <!-- <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li> -->
        </ul>
    </main>
</body>
</html>
